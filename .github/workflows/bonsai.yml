# Grows a pixel-art bonsai pair from GitHub history, grounded with pot base at bottom
name: bonsai

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    paths: [.github/workflows/bonsai.yml]

permissions:
  contents: write

concurrency:
  group: bonsai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Generate Maximized Bonsai Pair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/egorthinks/git-bonsai.git /tmp/git-bonsai-repo
          node -e '
          const data = require("/tmp/git-bonsai-repo/dist/src/data.js");
          const index = require("/tmp/git-bonsai-repo/dist/src/index.js");
          const fs = require("fs");

          async function main() {
              const token = process.env.GH_TOKEN;
              const realMetrics = await data.fetchMetrics("AniruthKarthik", token);
              
              // Maximize metrics for peak evolutionary bonsai
              const maxMetrics = {
                  ...realMetrics,
                  totalContributions: 50000,
                  createdAt: new Date(Date.now() - 12 * 365.25 * 86400000).toISOString(),
                  maxStreak: 365,
                  currentStreak: 365,
                  longestGapDays: 0,
                  gapsOver60d: 0,
                  repoCount: 25,
                  burstiness: 0.2,
                  weekendRatio: 0.25
              };
              
              const out = index.generate(maxMetrics, { season: "auto" });
              fs.mkdirSync("bonsai", { recursive: true });
              fs.writeFileSync("bonsai/bonsai_raw.gif", out.gif);
              fs.writeFileSync("bonsai/bonsai-growth.gif", out.growthGif);
              fs.writeFileSync("bonsai/bonsai.png", out.png);
              fs.writeFileSync("bonsai/bonsai.svg", out.svg);
          }
          main();
          '
          rm -rf /tmp/git-bonsai-repo

      - name: Ground bonsai to bottom & generate mirrored right bonsai
        run: |
          CMD="magick"
          if ! command -v magick &>/dev/null; then
            CMD="convert"
          fi
          $CMD bonsai/bonsai_raw.gif -coalesce -background none -gravity South -extent 189x259 bonsai/bonsai.gif
          rm -f bonsai/bonsai_raw.gif
          $CMD bonsai/bonsai.gif -flop bonsai/bonsai-right.gif
          git config user.name "git-bonsai[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bonsai
          if git diff --cached --quiet; then
            echo "bonsai unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: tend the grounded bonsai pair 🌳"
          git pull --rebase origin "${GITHUB_REF_NAME:-git-koi}" || true
          git push
