# Grows a pixel-art bonsai pair from GitHub history, grounded with pot base at bottom
name: bonsai

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    paths: [.github/workflows/bonsai.yml]

permissions:
  contents: write

concurrency:
  group: bonsai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - uses: egorthinks/git-bonsai@v1
        with:
          user: AniruthKarthik
          output-dir: bonsai
          commit: 'false'
      - name: Ground bonsai to bottom & generate mirrored right bonsai
        run: |
          CMD="magick"
          if ! command -v magick &>/dev/null; then
            CMD="convert"
          fi
          mkdir -p /tmp/b_orig /tmp/b_grounded
          $CMD bonsai/bonsai.gif -coalesce /tmp/b_orig/f_%03d.png
          python3 - << 'PYEOF'
          import subprocess, glob, shutil
          cmd = "magick" if shutil.which("magick") else "convert"
          frames = sorted(glob.glob('/tmp/b_orig/f_*.png'))
          for i, f in enumerate(frames):
              c = [
                  cmd, '-size', '137x259', 'xc:none',
                  f, '-geometry', '+0+135', '-composite',
                  f'/tmp/b_grounded/f_{i:03d}.png'
              ]
              subprocess.run(c, check=True)
          PYEOF
          $CMD -delay 8 /tmp/b_grounded/f_*.png bonsai/bonsai.gif
          $CMD bonsai/bonsai.gif -flop bonsai/bonsai-right.gif
          rm -rf /tmp/b_orig /tmp/b_grounded
          git config user.name "git-bonsai[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bonsai
          if git diff --cached --quiet; then
            echo "bonsai unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: tend the grounded bonsai pair 🌳"
          git pull --rebase origin "${GITHUB_REF_NAME:-git-koi}" || true
          git push
