# Draws a pair of pixel-art koi from public GitHub activity and composites them in the pond
name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency:
  group: koi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Setup git-koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: /tmp/ignore_init

      - name: Maximize Snapshot & Draw Adult Koi Pair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-koi collect ${{ github.repository_owner }} --output /tmp/snapshot.json
          # Maximize contributions to reach 100,000+ max growth threshold
          jq '.contribution_history.days |= map(.contribution_count = 150)' /tmp/snapshot.json > /tmp/snapshot_max.json
          git-koi render /tmp/snapshot_max.json --output-dir koi/white --body white
          git-koi render /tmp/snapshot_max.json --output-dir koi/black --body black

      - name: Organize & Composite Koi Pool
        run: |
          cp koi/white/koi.gif koi/koi.gif
          cp koi/black/koi.gif koi/koi-black.gif
          mkdir -p /tmp/w /tmp/b /tmp/b_flop /tmp/out
          
          # Detect ImageMagick command (magick on IM7, convert on IM6)
          CMD="magick"
          if ! command -v magick &>/dev/null; then
            CMD="convert"
          fi
          
          $CMD koi/koi.gif -coalesce /tmp/w/f_%03d.png
          $CMD koi/koi-black.gif -coalesce /tmp/b/f_%03d.png
          
          python3 - << 'PYEOF'
          import glob, subprocess, shutil
          cmd = "magick" if shutil.which("magick") else "convert"
          
          w_frames = sorted(glob.glob('/tmp/w/f_*.png'))
          b_frames = sorted(glob.glob('/tmp/b/f_*.png'))
          n_frames = min(len(w_frames), len(b_frames))
          
          for i in range(n_frames):
              subprocess.run([cmd, f'/tmp/b/f_{i:03d}.png', '-flop', f'/tmp/b_flop/f_{i:03d}.png'], check=True)
          
          offset = n_frames // 4
          half = n_frames // 2
          
          for i in range(n_frames):
              w = f'/tmp/w/f_{i:03d}.png'
              b = f'/tmp/b_flop/f_{(i + offset) % n_frames:03d}.png'
              first, second = (w, b) if i < half else (b, w)
              c = [
                  cmd, '-size', '512x520', 'xc:none',
                  first, '-geometry', '+0+0', '-composite',
                  second, '-geometry', '+0+0', '-composite',
                  f'/tmp/out/f_{i:03d}.png'
              ]
              subprocess.run(c, check=True)
          PYEOF
          
          $CMD -delay 6.67 -dispose Background /tmp/out/f_*.png -layers Optimize koi/pond_crossing.gif
          rm -rf /tmp/w /tmp/b /tmp/b_flop /tmp/out koi/white koi/black

      - name: Commit koi if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/koi.gif koi/koi-black.gif koi/pond_crossing.gif
          if git diff --cached --quiet; then
            echo "The koi are unchanged; nothing to commit."
            exit 0
          fi
          git commit --message "koi: draw the day's koi pair"
          git pull --rebase origin "${GITHUB_REF_NAME:-git-koi}" || true
          git push
